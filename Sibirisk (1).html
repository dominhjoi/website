ver no-repeat;transform:translate3d(var(--px,0),var(--py,0),0);transition:transform 1.2s var(--ease);animation:drift 50s ease-in-out infinite alternate}
@keyframes drift{from{scale:1.04}to{scale:1.12;rotate:1deg}}
@keyframes rise{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
header{display:grid;place-items:center;min-height:62svh;padding:clamp(72px,12vh,140px) 20px clamp(24px,4vh,48px);text-align:center;animation:rise 1.2s var(--ease) both}
h1{font-family:"Archivo Black","Arial Black",Impact,system-ui,sans-serif;font-size:clamp(3.6rem,15vw,10.5rem);font-weight:400;font-synthesis:none;letter-spacing:.01em;line-height:.95;color:#fff;text-shadow:0 0 28px rgba(255,255,255,.45),0 0 70px rgba(255,255,255,.22),0 4px 24px rgba(0,0,0,.5)}

main{padding:0 20px clamp(120px,22vh,240px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),320px));justify-content:center;gap:28px;max-width:780px;margin:0 auto}
.card{position:relative;display:block;aspect-ratio:1;overflow:hidden;border-radius:24px;color:#000;text-decoration:none;cursor:pointer;
background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(255,255,255,.4));backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);
box-shadow:0 22px 54px rgba(0,0,0,.5);transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.card.enter{animation:rise .9s var(--ease) both;animation-delay:calc(.35s + var(--i)*.14s)}
.card:hover,.card:focus-visible{transform:translateY(-8px) scale(1.02);box-shadow:0 32px 70px rgba(0,0,0,.6),0 0 44px rgba(255,255,255,.2);outline:none}
.card:focus-visible{border-color:#000}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.card:hover img{transform:scale(1.08)}
.ph{position:absolute;inset:0;margin:auto;width:22%;opacity:.3}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;background:var(--glass-hi);backdrop-filter:blur(10px);opacity:0;transition:opacity .5s var(--ease)}
.ov span{font-size:clamp(1.4rem,3.6vw,2rem);font-weight:700;letter-spacing:.06em;translate:0 16px;transition:translate .65s var(--ease)}
.ov .soon{font-weight:400;font-size:1.05rem;letter-spacing:.14em}
.card:hover .ov,.card:focus-visible .ov{opacity:1}
.card:hover .ov span,.card:focus-visible .ov span{translate:0 0}
@media(hover:none){.ov{opacity:1;place-items:end center;background:linear-gradient(transparent 60%,var(--glass-hi));backdrop-filter:none}.ov span{translate:0 0;font-size:1.1rem}}
body.admin .card{outline:1.5px dashed rgba(255,255,255,.85);outline-offset:6px}
body.admin .card::after{content:"Edit";position:absolute;top:12px;right:12px;padding:5px 12px;border-radius:99px;background:var(--glass-hi);font-size:.75rem;letter-spacing:.08em}
#x{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.24);color:#000;font:inherit;font-size:19px;line-height:1;opacity:.4;cursor:pointer;transition:opacity .4s,background .4s}
#x:hover,#x:focus-visible{opacity:.9;background:rgba(255,255,255,.6);outline:none}
#bar{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;padding:5px 6px 5px 18px;border-radius:99px;background:var(--glass-hi);backdrop-filter:blur(14px);font-size:.85rem;box-shadow:0 12px 34px rgba(0,0,0,.45);z-index:10;animation:rise .6s var(--ease) both}
#bar[hidden]{display:none}
#bar button,.lnk{border:0;background:transparent;color:#000;font:inherit;padding:8px 13px;border-radius:99px;cursor:pointer;transition:background .3s}
#bar button:hover,.lnk:hover{background:rgba(0,0,0,.09)}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s}
.modal.open{opacity:1;visibility:visible}
.panel{width:min(100%,370px);max-height:calc(100svh - 40px);overflow:auto;padding:34px 30px 26px;border-radius:28px;background:rgba(255,255,255,.4);backdrop-filter:blur(28px) saturate(1.5);border:1px solid rgba(255,255,255,.8);box-shadow:0 30px 80px rgba(0,0,0,.5);translate:0 22px;scale:.96;transition:translate .6s var(--ease),scale .6s var(--ease)}
.modal.open .panel{translate:0 0;scale:1}
.panel h2{text-align:center;font-size:1.5rem;font-weight:500;letter-spacing:.14em;margin-bottom:26px}
.panel input[type=text],.panel input[type=password]{display:block;width:100%;height:48px;padding:0 16px;margin:0 0 16px;background:transparent;border:1.5px solid var(--line);border-radius:14px;color:#000;font:inherit;outline:0;transition:background .3s,box-shadow .3s}
.panel input:focus{background:rgba(255,255,255,.28);box-shadow:0 0 0 4px rgba(255,255,255,.5)}
.fld{display:block;font-size:.85rem;margin-bottom:6px}
.fld input{margin-top:6px!important}
.btn{width:100%;height:48px;margin-top:4px;border:1.5px solid #000;border-radius:14px;background:transparent;color:#000;font:inherit;font-weight:700;letter-spacing:.12em;cursor:pointer;transition:background .3s,transform .3s var(--ease)}
.btn:hover{background:rgba(255,255,255,.7)}.btn:active{transform:scale(.98)}
.err{min-height:1.3em;margin-bottom:6px;text-align:center;font-size:.85rem}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{translate:-9px 0}40%,80%{translate:9px 0}}
.pv{display:grid;place-items:center;aspect-ratio:16/9;margin-bottom:18px;border:1.5px dashed var(--line);border-radius:14px;background:center/cover;overflow:hidden;cursor:pointer;font-size:.85rem}
.pv span{padding:6px 13px;border-radius:99px;transition:opacity .3s}
.pv.has span{opacity:0;background:var(--glass-hi)}.pv.has:hover span{opacity:1}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;margin-top:12px;font-size:.85rem}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.card.enter{opacity:1}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<header>
  <h1>Sibirisk</h1>
</header>

<main><div class="grid" id="grid"></div></main>

<div id="bar" hidden><span>Admin mode</span><button id="add">Add card</button><button id="out">Log out</button></div>
<button id="x" aria-label="Admin login">&times;</button>

<div class="modal" id="login">
  <form class="panel" id="lf" role="dialog" aria-label="Login" autocomplete="off">
    <h2>Login</h2>
    <input id="u" type="text" aria-label="Username" autocomplete="off" spellcheck="false" autocapitalize="off" required>
    <input id="p" type="password" aria-label="Password" autocomplete="new-password" required>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="submit">Continue</button>
  </form>
</div>

<div class="modal" id="ed">
  <form class="panel" id="eform" role="dialog" aria-label="Edit game" autocomplete="off">
    <h2>Edit game</h2>
    <label class="pv" id="pv"><input id="ef" type="file" accept="image/*" hidden><span>Upload image</span></label>
    <label class="fld">Title<input id="et" type="text" maxlength="40"></label>
    <label class="fld">Link (Google Drive or any URL)<input id="eu" type="text" inputmode="url" spellcheck="false"></label>
    <button class="btn" type="submit">Save</button>
    <div class="row"><button type="button" class="lnk" id="rm">Remove image</button><button type="button" class="lnk" id="del">Delete card</button><button type="button" class="lnk" data-close>Cancel</button></div>
  </form>
</div>

<script>
const USER = 'MINDEV', PASS = '100214', KEY = 'sibirisk.games.v1', SESS = 'sibirisk.admin';
const $ = s => document.querySelector(s);
const st = (kind, k, v) => { try { const s = window[kind]; if (v === undefined) return s.getItem(k); v === null ? s.removeItem(k) : s.setItem(k, v); } catch (e) { return null; } };
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const cleanUrl = u => { u = (u || '').trim(); if (!u) return ''; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u; return /^https?:\/\//i.test(u) ? u : ''; };

let games = (() => { try { const g = JSON.parse(st('localStorage', KEY)); if (Array.isArray(g)) return g; } catch (e) {} return [{ title: 'Trafika', img: '', url: '' }, { title: '', img: '', url: '' }]; })();
let admin = st('sessionStorage', SESS) === '1', editing = -1, draft = '';
const save = () => st('localStorage', KEY, JSON.stringify(games));

const PH = '<svg class="ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>';

function render(first) {
  document.body.classList.toggle('admin', admin);
  $('#bar').hidden = !admin;
  $('#grid').innerHTML = games.map((g, i) => {
    const url = cleanUrl(g.url);
    return `<a class="card${first ? ' enter' : ''}" style="--i:${i}" data-i="${i}" aria-label="${esc(g.title || 'Empty slot')}" ${url ? `href="${esc(url)}" target="_blank" rel="noopener"` : 'role="button" tabindex="0"'}>
      ${g.img ? `<img src="${esc(g.img)}" alt="">` : PH}
      <div class="ov"><span class="${g.title ? '' : 'soon'}">${esc(g.title || 'Coming soon')}</span></div></a>`;
  }).join('');
}

/* Cards: public click follows the link at once; admin click opens the editor */
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  if (admin) { e.preventDefault(); openEditor(+c.dataset.i); }
  else if (!c.getAttribute('href')) e.preventDefault();
});
$('#grid').addEventListener('keydown', e => {
  if (admin && e.key === 'Enter' && e.target.matches('.card')) openEditor(+e.target.dataset.i);
});

/* Modals */
const modals = [...document.querySelectorAll('.modal')];
const show = m => { m.classList.add('open'); setTimeout(() => m.querySelector('input:not([hidden])')?.focus({ preventScroll: true }), 80); };
const hide = m => m.classList.remove('open');
modals.forEach(m => m.addEventListener('mousedown', e => { if (e.target === m) hide(m); }));
document.addEventListener('click', e => { if (e.target.matches('[data-close]')) hide(e.target.closest('.modal')); });
addEventListener('keydown', e => { if (e.key === 'Escape') modals.forEach(m => hide(m)); });

/* Login */
$('#x').onclick = () => { if (admin) return; $('#lf').reset(); $('#err').textContent = ''; show($('#login')); };
$('#lf').addEventListener('submit', e => {
  e.preventDefault();
  if ($('#u').value.trim() === USER && $('#p').value === PASS) {
    admin = true; st('sessionStorage', SESS, '1'); hide($('#login')); render();
  } else {
    const p = $('#lf'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
    $('#err').textContent = 'Incorrect username or password.'; $('#p').value = '';
  }
});
$('#out').onclick = () => { admin = false; st('sessionStorage', SESS, null); render(); };

/* Editor */
const preview = () => { const pv = $('#pv'); pv.style.backgroundImage = draft ? `url("${draft}")` : ''; pv.classList.toggle('has', !!draft); };
function openEditor(i) {
  editing = i; const g = games[i]; draft = g.img || '';
  $('#et').value = g.title; $('#eu').value = g.url;
  $('#del').textContent = 'Delete card'; delete $('#del').dataset.arm;
  preview(); show($('#ed'));
}
$('#ef').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {   /* downscale so it fits in local storage */
      const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      draft = c.toDataURL('image/jpeg', .85); preview();
    };
    im.src = r.result;
  };
  r.readAsDataURL(f); e.target.value = '';
});
$('#rm').onclick = () => { draft = ''; preview(); };
$('#eform').addEventListener('submit', e => {
  e.preventDefault();
  games[editing] = { title: $('#et').value.trim(), url: $('#eu').value.trim(), img: draft };
  save(); render(); hide($('#ed'));
});
$('#del').onclick = e => {
  if (e.target.dataset.arm) { games.splice(editing, 1); save(); render(); hide($('#ed')); }
  else { e.target.dataset.arm = 1; e.target.textContent = 'Click again to delete'; }
};
$('#add').onclick = () => { games.push({ title: '', img: '', url: '' }); save(); render(); openEditor(games.length - 1); };

/* Parallax */
if (matchMedia('(prefers-reduced-motion: no-preference)').matches) {
  addEventListener('pointermove', e => {
    const s = $('.sky').style;
    s.setProperty('--px', ((e.clientX / innerWidth - .5) * -26) + 'px');
    s.setProperty('--py', ((e.clientY / innerHeight - .5) * -26) + 'px');
  }, { passive: true });
}

render(true);
</script>
</body>
</html>
